<style>

.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

.frm{display:flex;gap:8px;margin:10px 0 4px}.frm input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:8px 10px;font-size:16px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--s2);border-radius:14px;padding:12px;margin-bottom:8px}
.ch{display:flex;align-items:center}.ch b{flex:1}
.sm{font-size:13px;color:var(--dim)}.er{color:var(--er)}.lnk{color:var(--ac);font-size:14px}

#bd{display:none}
@media(max-width:820px){#bm,#sbx{display:inline-flex}#sb{position:fixed;inset:0 auto 0 0;width:min(300px,84vw);transform:translateX(-102%);transition:transform .2s;z-index:20}#sb.open{transform:none}#bd.on{display:block;position:fixed;inset:0;background:#0009;z-index:15}}
@media(prefers-reduced-motion:reduce){#sb{transition:none}}

<div id="app">
 <aside id="sb" aria-label="Menu">
  <div class="sbh"><svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0d0e10" stroke="#26282d"/><g fill="none" stroke-linecap="round"><path d="M19 20C33 20 30 32 42 32" stroke="#4f7ff0" stroke-width="1.8" opacity=".9"/><path d="M19 32H42" stroke="#4f7ff0" stroke-width="1.8" opacity=".9"/><path d="M19 44C33 44 30 32 42 32" stroke="#4f7ff0" stroke-width="1.8" opacity=".9"/></g><g fill="#aab4c8"><circle cx="16" cy="20" r="3.2"/><circle cx="16" cy="32" r="3.2"/><circle cx="16" cy="44" r="3.2"/></g><circle cx="46" cy="32" r="8" fill="#eef2fa"/><circle cx="46" cy="32" r="3" fill="#0d0e10"/></svg><span id="brand"></span><button class="ib sm" id="sbx" title="Fechar menu" aria-label="Fechar menu"></button></div>

 <p class="sm">As chaves ficam salvas só neste navegador e vão direto ao provedor, sem passar por nenhum servidor nosso. Quem usar este aparelho, ou extensões instaladas no navegador, pode acessá-las. Remova-as se o aparelho for compartilhado.</p>

<script>
"use strict";
let saveErr=false;
const BRAND={name:"Nexacode",tag:"Várias IAs gratuitas em um só chat."};
const P={
 groq:{u:"https://api.groq.com/openai/v1",s:"console.groq.com/keys",p:["llama-3.3-70b","llama-3","qwen"]},
 gemini:{u:"https://generativelanguage.googleapis.com/v1beta/openai",s:"aistudio.google.com/apikey",p:["flash"]},
 openrouter:{u:"https://openrouter.ai/api/v1",s:"openrouter.ai/keys",p:[":free"]},
 cerebras:{u:"https://api.cerebras.ai/v1",s:"cloud.cerebras.ai",p:["llama-3.3","qwen","llama"]},
 mistral:{u:"https://api.mistral.ai/v1",s:"console.mistral.ai/api-keys",p:["mistral-small","mistral-nemo","mistral-large"]}};
const AVOID=/vision|guard|whisper|tts|embed|image|audio|moderation|ocr/i;
const $=s=>document.querySelector(s);
const ls={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{saveErr=true;return false}}};
let cfg=ls.g("nx_cfg",{keys:{},models:{},mode:"inteligente"}),use=ls.g("nx_use",{}),convs=ls.g("nx_cv",[]),cur=null,ctrl=null,busy=false;
const save=()=>{ls.s("nx_cfg",cfg);ls.s("nx_use",use);ls.s("nx_cv",convs.filter(c=>c.msgs.length).slice(0,30))};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
const li=l=>/^\s*([-*]|\d+\.)\s/.test(l);
function md(s){return s.split("```").map((p,i)=>{
 if(i%2){const n=p.indexOf("\n");return "<pre><code>"+esc(n<0?p:p.slice(n+1))+"</code></pre>"}
 return esc(p).split(/\n{2,}/).filter(b=>b.trim()).map(b=>{const ls_=b.split("\n").filter(l=>l.trim());
  if(ls_.every(li))return "<ul>"+ls_.map(l=>"<li>"+inl(l.replace(/^\s*([-*]|\d+\.)\s/,""))+"</li>").join("")+"</ul>";
  const h=b.match(/^#{1,6}\s*(.*)$/);if(h&&ls_.length==1)return "<h4>"+inl(h[1])+"</h4>";
  return "<p>"+inl(b).replace(/\n/g,"<br>")+"</p>"}).join("")}).join("")}
const clean=t=>t.replace(/<think>[\s\S]*?(<\/think>|$)/gi,"").trim();
const today=()=>new Date().toISOString().slice(0,10);

// ---------- provedores, cotas e chamadas ----------
function avail(){const now=Date.now();return Object.keys(cfg.keys).filter(p=>P[p]&&!((use[p]||{}).until>now))
 .sort((a,b)=>cnt(a)-cnt(b))}
const cnt=p=>(use[p]&&use[p].day===today())?use[p].n:0;
function cool(p,s){(use[p]=use[p]||{}).until=Date.now()+s*1000;save()}
async function call(p,msgs,o={}){
 let r;
 try{r=await fetch(P[p].u+"/chat/completions",{method:"POST",signal:o.signal,
  headers:{"Content-Type":"application/json",Authorization:"Bearer "+cfg.keys[p]},
  body:JSON.stringify({model:cfg.models[p]||"",messages:msgs,max_tokens:o.max||1000,temperature:o.temp??0.7,stream:!!o.onTok})})}
 catch(e){if(e.name==="AbortError")throw e;cool(p,30);throw new Error(p+": sem conexão ou bloqueado pelo navegador")}
 if(!r.ok){const ra=parseInt(r.headers.get("Retry-After")||"60",10)||60;
  if(r.status===429||r.status===503)cool(p,Math.min(Math.max(ra,30),3600));else if(r.status===401||r.status===403)cool(p,3600);
  throw new Error(p+": erro "+r.status+(r.status===401?" (chave inválida)":r.status===429?" (cota)":""))}
 let txt="",cut=false;
 if(o.onTok){const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
   const ls_=buf.split("\n");buf=ls_.pop();
   for(const l of ls_){if(!l.startsWith("data: ")||l.includes("[DONE]"))continue;
    try{const j=JSON.parse(l.slice(6)).choices[0];if(j.finish_reason==="length")cut=true;const d=j.delta&&j.delta.content;if(d){txt+=d;o.onTok(clean(txt))}}catch{}}}}
 else{const d=await r.json();txt=(d.choices&&d.choices[0].message.content)||"";if(d.choices&&d.choices[0].finish_reason==="length")cut=true}
 txt=clean(txt);if(!txt)throw new Error(p+": resposta vazia");if(cut)txt+="\n\n(resposta cortada pelo limite de tamanho)";
 const u=use[p]=use[p]||{};if(u.day!==today()){u.day=today();u.n=0}u.n++;save();return txt}
const last=m=>[...m].reverse().find(x=>x.role==="user").content;
async function um(m,o){const er=[];for(const p of avail()){try{return[await call(p,m,o),[p]]}catch(e){if(e.name==="AbortError")throw e;er.push(e.message)}}
 throw new Error(er.length?"Nenhuma IA respondeu agora: "+er.join(" | "):"Nenhuma IA disponível. Toque em ⚙ IAs e adicione uma chave.")}
async function par(ps,m,o){const r={};await Promise.all(ps.map(async p=>{try{r[p]=await call(p,m,o)}catch(e){if(e.name==="AbortError")throw e;r[p]=null}}));return r}
async function fusao(m,o,st){const d=avail();if(d.length<2)return um(m,o);
 st("Consultando "+d.slice(0,2).join(" + ")+"…");const r=await par(d.slice(0,2),m,{signal:o.signal});
 const ok=Object.entries(r).filter(e=>e[1]);if(ok.length<2)return ok.length?[ok[0][1],[ok[0][0]]]:um(m,o);
 const[[pa,ta],[pb,tb]]=ok,j=avail().find(p=>p!==pa&&p!==pb)||pa;st("Juntando o melhor com "+j+"…");
 const jm=[{role:"system",content:"Você é o editor final. Recebe duas respostas para a mesma pergunta. Escreva UMA resposta final em português do Brasil: mantenha o que as duas dizem em comum, corrija o que uma errou quando for claro, aproveite o melhor de cada. Não mencione resposta A ou B nem comente o processo."},
  {role:"user",content:"PERGUNTA:\n"+last(m)+"\n\nRESPOSTA A:\n"+ta+"\n\nRESPOSTA B:\n"+tb}];
 try{return[await call(j,jm,o),[pa,pb,j]]}catch(e){if(e.name==="AbortError")throw e;return[ta,[pa,pb]]}}
async function critica(m,o,st){const d=avail();if(d.length<2)return um(m,o);
 st("Rascunho com "+d[0]+"…");let ra;try{ra=await call(d[0],m,{signal:o.signal,temp:0.9})}catch(e){if(e.name==="AbortError")throw e;return um(m,o)}
 st("Melhorando com "+d[1]+"…");
 const jm=[{role:"system",content:"Você é um editor criativo exigente. Leia o rascunho, ache o que está fraco (clichês, ritmo, clareza) e entregue SOMENTE a versão final melhorada, em português do Brasil, sem comentar as mudanças."},
  {role:"user",content:"PEDIDO:\n"+last(m)+"\n\nRASCUNHO:\n"+ra}];
 try{return[await call(d[1],jm,{...o,temp:0.8}),[d[0],d[1]]]}catch(e){if(e.name==="AbortError")throw e;return[ra,[d[0]]]}}
async function corrida(m,o,st){const d=avail().slice(0,3);if(d.length<2)return um(m,o);
 st("Corrida entre "+d.join(", ")+"…");const c=new AbortController();o.signal&&o.signal.addEventListener("abort",()=>c.abort());
 try{const w=await Promise.any(d.map(async p=>[await call(p,m,{signal:c.signal}),[p]]));c.abort();return w}
 catch(e){if(o.signal&&o.signal.aborted)throw new DOMException("","AbortError");return um(m,o)}}
const CRI=/escreva|história|historia|poema|roteiro|slogan|ideia|crie|conto|letra|legenda|nome para/i,PRO=/analise|compare|explique|código|codigo|plano|resuma|revise|por que|estratégia|estrategia|vantagens/i;
const pick=t=>t.length<60&&!CRI.test(t)&&!PRO.test(t)?"economia":CRI.test(t)?"critica":(t.length>90||PRO.test(t))?"fusao":"economia";
async function ask(text,hist,mode,st,onTok,signal){
 let real=mode==="inteligente"?pick(text):mode,note="";
 if(real!=="economia"&&avail().length<2){note="só 1 IA ativa";real="economia"}
 const la=[...hist].reverse().find(x=>x.r==="a");
 const sys="Você é o assistente do "+BRAND.name+", um site que combina várias IAs gratuitas. Responda em português do Brasil, de forma direta e correta. Você não consegue abrir links nem ver a internet: se pedirem para avaliar um site ou link, diga isso e peça que a pessoa cole o conteúdo. Não afirme qual empresa criou você nem quantas IAs foram usadas: o nome do modelo aparece abaixo de cada resposta."+(la&&la.meta?" Na resposta anterior o "+BRAND.name+" usou: "+la.meta+".":"")+" Se não souber, diga que não sabe.";
 const m=[{role:"system",content:sys},
  ...hist.slice(-8).map(x=>({role:x.r==="u"?"user":"assistant",content:x.t.slice(0,1200)})),{role:"user",content:text}];
 const o={signal,onTok};const f={economia:(m,o)=>(st("Consultando "+(avail()[0]||"…")+"…"),um(m,o)),fusao,critica,corrida}[real];
 const[t,used]=await f(m,o,st);if((real==="fusao"||real==="critica")&&used.length<2){note=note||"só 1 IA respondeu";real="economia"}return{t,used,real,note}}


// ---------- interface ----------
const MARK='<svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0d0e10" stroke="#26282d"/><g fill="none" stroke-linecap="round"><path d="M19 20C33 20 30 32 42 32" stroke="#4f7ff0" stroke-width="1.8" opacity=".9"/><path d="M19 32H42" stroke="#4f7ff0" stroke-width="1.8" opacity=".9"/><path d="M19 44C33 44 30 32 42 32" stroke="#4f7ff0" stroke-width="1.8" opacity=".9"/></g><g fill="#aab4c8"><circle cx="16" cy="20" r="3.2"/><circle cx="16" cy="32" r="3.2"/><circle cx="16" cy="44" r="3.2"/></g><circle cx="46" cy="32" r="8" fill="#eef2fa"/><circle cx="46" cy="32" r="3" fill="#0d0e10"/></svg>';
const NM={groq:"Groq",gemini:"Gemini",openrouter:"OpenRouter",cerebras:"Cerebras",mistral:"Mistral"};
const IC={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',check:'<path d="M5 12l5 5 9-10"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',pin:'<path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',stop:'<rect x="7" y="7" width="10" height="10" rx="2"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon:'<path d="M20 14a8 8 0 1 1-10-10 6 6 0 0 0 10 10z"/>',refresh:'<path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/>',dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'};
const ic=n=>'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+"</svg>";
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function btn(i,t,f,c){const b=mk("button","ib "+(c||"sm"));b.innerHTML=ic(i);b.title=t;b.setAttribute("aria-label",t);b.onclick=f;return b}
const el=$("#msgs"),st=t=>{$("#st").textContent=t},nk=()=>Object.keys(cfg.keys).length;
const side=o=>{$("#sb").classList.toggle("open",o);$("#bd").classList.toggle("on",o)};
function theme(){const t=cfg.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t;$("#th").innerHTML=ic(t==="dark"?"sun":"moon")}
const LEG={p:["Política de privacidade",()=>"<p>O "+BRAND.name+" não tem login nem banco de dados: conversas, chaves e preferências ficam salvas só no seu navegador. Você pode apagá-las limpando os dados do site.</p><p>Suas mensagens são enviadas diretamente aos provedores de IA que você ativar (Groq, Gemini, OpenRouter, Cerebras ou Mistral), que têm políticas próprias. Não envie dados sensíveis se não concordar com elas.</p>"],
 t:["Termos de uso",()=>"<p>O "+BRAND.name+" é oferecido como está, sem garantia de disponibilidade. As respostas vêm de modelos de IA e podem conter erros: confira o que for importante.</p><p>Você é responsável pelas chaves que cadastra e por cumprir os termos de cada provedor, incluindo os limites do plano grátis. Não use o serviço para fins ilegais.</p><p>O código e a marca são protegidos: todos os direitos reservados.</p>"],
 c:["Contato",()=>'<p>Dúvidas, sugestões ou problemas? Escreva para <a href="mailto:Rennansabinovitorino@gmail.com">Rennansabinovitorino@gmail.com</a>.</p>']};
function info(k){$("#dlh").textContent=LEG[k][0];$("#dlb").innerHTML=LEG[k][1]();$("#dl").showModal()}
function list(){const l=$("#list"),q=$("#q").value.toLowerCase().trim();l.textContent="";
 const its=convs.filter(c=>c.msgs.length&&(!q||c.title.toLowerCase().includes(q)||c.msgs.some(x=>x.t.toLowerCase().includes(q))));
 [["Fixadas",its.filter(c=>c.pin)],["Recentes",its.filter(c=>!c.pin)]].forEach(([n,a])=>{if(!a.length)return;l.appendChild(mk("div","gh",n));a.forEach(c=>l.appendChild(row(c)))});
 if(!its.length)l.appendChild(mk("div","gh",q?"Nada encontrado":"Sem conversas ainda"))}
function row(c){const d=mk("div","cv"+(c===cur?" on":""));d.tabIndex=0;d.appendChild(mk("span",0,c.title));
 d.onclick=()=>{cur=c;render();list();side(false)};d.onkeydown=e=>{if(e.key==="Enter")d.onclick()};
 if(c===cur){const a=mk("span","ac");
  a.append(btn("pin",c.pin?"Desafixar":"Fixar",e=>{e.stopPropagation();c.pin=!c.pin;save();list()}),
   btn("edit","Renomear",e=>{e.stopPropagation();const t=prompt("Novo título",c.title);if(t&&t.trim()){c.title=t.trim().slice(0,60);save();list();render()}}),
   btn("trash","Excluir",e=>{e.stopPropagation();if(confirm("Excluir esta conversa?")){convs=convs.filter(x=>x!==c);cur=convs.find(x=>x.msgs.length)||null;save();render();list()}}));d.appendChild(a)}
 return d}
function render(){el.textContent="";$("#ttl").textContent=cur&&cur.msgs.length?cur.title:"";
 if(!cur||!cur.msgs.length){empty();return}
 cur.msgs.forEach((x,i)=>bubble(x,i===cur.msgs.length-1));el.scrollTop=el.scrollHeight}
function empty(){const n=nk(),w=mk("div","hi"),lg=mk("div");lg.innerHTML=MARK;w.append(lg,mk("h2",0,"Como posso ajudar?"),
  mk("p","sub",n?"Escolha um modo no topo e escreva sua pergunta.":"Adicione uma chave de API para começar. Os provedores têm plano grátis."));
 if(n<2){const b=mk("button","pill pri",n?"Adicionar mais uma IA (libera Fusão e Crítica)":"Adicionar chave API");b.onclick=openKeys;w.appendChild(b)}
 const sg=mk("div","chips");sg.style.marginTop="16px";["Explique um conceito difícil de forma simples","Revise e melhore este texto:","Monte um plano de estudos para 2 semanas"].forEach(s=>{const c=mk("button","chip",s);c.onclick=()=>{$("#t").value=s;$("#t").focus()};sg.appendChild(c)});w.appendChild(sg);el.appendChild(w)}
function bubble(x,last,pend){const d=mk("div","m "+x.r);d.innerHTML=md(x.t);
 if(x.r==="a"&&!pend){const b=mk("div","meta");if(x.meta)b.appendChild(mk("span",0,x.meta));else b.appendChild(mk("span"));
  b.appendChild(btn("copy","Copiar",e=>{const t=e.currentTarget;navigator.clipboard.writeText(x.t).then(()=>{t.innerHTML=ic("check");setTimeout(()=>t.innerHTML=ic("copy"),1200)}).catch(()=>st("Não consegui copiar."))}));
  if(last)b.appendChild(btn("refresh","Gerar de novo",regen));d.appendChild(b)}
 el.appendChild(d);return d}
async function send(txt){
 if(busy){ctrl&&ctrl.abort();return}
 const t=(txt==null?$("#t").value:txt).trim();if(!t)return;
 if(!nk()){openKeys();return}
 if(!cur||!convs.includes(cur)){cur={id:Date.now(),title:"Nova conversa",msgs:[]};convs.unshift(cur)}
 const hist=cur.msgs.slice();$("#t").value="";$("#t").style.height="auto";cur.msgs.push({r:"u",t});render();
 const box=bubble({r:"a",t:"…"},false,true),t0=Date.now();busy=true;$("#go").innerHTML=ic("stop");$("#go").title="Parar";ctrl=new AbortController();
 let r,err=null;
 try{r=await ask(t,hist,cfg.mode,st,x=>{box.innerHTML=md(x);el.scrollTop=el.scrollHeight},ctrl.signal)}catch(e){err=e}
 busy=false;$("#go").innerHTML=ic("up");$("#go").title="Enviar";
 if(err){cur.msgs.pop();$("#t").value=t;render();
  if(err.name==="AbortError")st("Cancelado. Sua mensagem voltou para o campo.");else{el.appendChild(mk("div","m a err",err.message));st("")}
  save();list();return}
 const meta=r.real+(r.note?" ("+r.note+")":"")+" · "+r.used.join(" + ")+" · "+Math.round((Date.now()-t0)/1000)+"s";
 cur.msgs.push({r:"a",t:r.t,meta});cur.msgs=cur.msgs.slice(-60);if(cur.title==="Nova conversa")cur.title=t.slice(0,48);
 convs=[cur,...convs.filter(x=>x!==cur)];save();render();list();
 st(saveErr?"Atenção: o armazenamento do navegador está cheio e a conversa pode não ser salva. Exporte ou exclua conversas antigas.":r.note?"Dica: com só 1 IA ativa não há fusão. Adicione outra em Chave API.":"")}
function regen(){if(busy||!cur||cur.msgs.length<2)return;const u=cur.msgs[cur.msgs.length-2];cur.msgs.splice(-2);send(u.t)}
// ---------- chave api ----------
const detect=k=>k.startsWith("gsk_")?"groq":k.startsWith("AIza")?"gemini":k.startsWith("sk-or-")?"openrouter":k.startsWith("csk-")?"cerebras":null;
async function addKey(p,k){
 if(k.length<15)return"Chave muito curta.";
 try{const r=await fetch(P[p].u+"/models",{headers:{Authorization:"Bearer "+k}});if(!r.ok)throw new Error("erro "+r.status);
  const j=await r.json(),ids=(j.data||j).map(x=>(x.id||"").replace("models/","")).filter(x=>x&&!AVOID.test(x)).sort();
  cfg.keys[p]=k;cfg.lists=cfg.lists||{};cfg.lists[p]=ids.slice(0,80);
  const def=P[p].p.map(q=>ids.find(x=>x.toLowerCase().includes(q))).find(Boolean)||ids[0]||"";
  cfg.models[p]=ids.includes(cfg.models[p])?cfg.models[p]:def;(cfg.status=cfg.status||{})[p]={ok:1,t:Date.now()};save();return""}
 catch(e){const m=String(e.message).slice(0,40);if(cfg.keys[p]){(cfg.status=cfg.status||{})[p]={ok:0,msg:m,t:Date.now()};save()}return"Não validou ("+m+"). Confira a chave e a internet."}}
let selP=null;
function openKeys(){selP=null;keys();$("#dk").showModal()}
function keys(){const a=$("#padd");a.textContent="";const free=Object.keys(P).filter(p=>!cfg.keys[p]);
 free.forEach(p=>{const c=mk("button","chip"+(p===selP?" on":""),NM[p]);c.onclick=()=>{selP=p;keys();const i=$("#pform input");if(i)i.focus()};a.appendChild(c)});
 if(!free.length)a.appendChild(mk("span","sm","Todos os provedores já estão conectados."));
 const f=$("#pform");f.textContent="";
 if(selP){const l=mk("a","lnk","Abrir a página da chave de "+NM[selP]+" ↗");l.href="https://"+P[selP].s;l.target="_blank";l.rel="noopener noreferrer";
  const i=mk("input");i.type="password";i.autocomplete="off";i.placeholder="Cole a chave aqui";i.setAttribute("aria-label","Chave de API de "+NM[selP]);
  const g=mk("button","pill pri","Conectar"),m=mk("span","sm");m.setAttribute("role","alert");
  g.onclick=async()=>{const k=i.value.trim(),d=detect(k);if(d&&d!==selP){m.className="sm er";m.textContent="Essa chave parece ser de "+NM[d]+". Escolha "+NM[d]+" acima.";return}
   g.disabled=true;m.className="sm";m.textContent="Validando…";const er=await addKey(selP,k);g.disabled=false;if(er){m.className="sm er";m.textContent=er;return}selP=null;keys();render()};
  const fr=mk("div","frm");fr.append(i,g);f.append(l,fr,m)}
 const c=$("#pcards");c.textContent="";const ps=Object.keys(cfg.keys);
 if(!ps.length)c.appendChild(mk("p","sm","Nenhuma IA conectada ainda."));ps.forEach(p=>c.appendChild(card(p)))}
function card(p){const d=mk("div","card"),h=mk("div","ch"),s=cfg.status&&cfg.status[p];h.appendChild(mk("b",0,NM[p]));
 const stt=mk("span","sm"+(s&&!s.ok?" er":""),!s?"Chave salva · não verificada":s.ok?"Verificada às "+new Date(s.t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"Erro: "+s.msg);
 h.append(btn("refresh","Testar conexão",async()=>{stt.textContent="Testando…";await addKey(p,cfg.keys[p]);keys()}),
  btn("trash","Remover "+NM[p],()=>{delete cfg.keys[p];delete cfg.models[p];if(cfg.status)delete cfg.status[p];save();keys();render()}));
 d.append(h,stt);
 if(cfg.lists&&cfg.lists[p]){const sl=mk("select");cfg.lists[p].forEach(id=>{const o=mk("option",0,id);o.value=id;sl.appendChild(o)});sl.value=cfg.models[p];sl.setAttribute("aria-label","Modelo de "+NM[p]);sl.onchange=()=>{cfg.models[p]=sl.value;save()};d.appendChild(sl)}
 d.appendChild(mk("span","sm","Usos hoje: "+cnt(p)));return d}
// ---------- ligações ----------
const HINT={inteligente:"Inteligente: escolhe o melhor modo para cada pedido.",economia:"Economia: 1 IA por vez, troca sozinha se a cota acabar.",fusao:"Fusão: 2 IAs respondem e uma terceira junta o melhor.",critica:"Crítica: uma IA escreve e outra melhora o texto.",corrida:"Corrida: várias IAs ao mesmo tempo, vale a mais rápida."};
document.title=BRAND.name+" · "+BRAND.tag;$("#brand").textContent=BRAND.name;
[["sbx","x"],["nw","plus"],["si","search"],["bk","key"],["bm","menu"],["ex","dl"],["go","up"],["dkx","x"],["dlx","x"]].forEach(([i,n])=>{$("#"+i).innerHTML=ic(n)});
$("#nw").insertAdjacentHTML("beforeend","Nova conversa");$("#bk").insertAdjacentHTML("beforeend","Chave API");
$("#go").onclick=()=>send();
$("#t").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>820){e.preventDefault();send()}});
$("#t").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,160)+"px"});
$("#nw").onclick=()=>{cur=null;render();list();side(false);$("#t").focus()};
$("#q").oninput=list;$("#bm").onclick=()=>side(true);$("#bd").onclick=()=>side(false);$("#sbx").onclick=()=>side(false);
$("#bk").onclick=()=>{openKeys();side(false)};$("#dkx").onclick=()=>$("#dk").close();$("#dlx").onclick=()=>$("#dl").close();
$("#rmall").onclick=()=>{if(confirm("Remover todas as chaves deste navegador?")){cfg.keys={};cfg.models={};cfg.lists={};cfg.status={};save();keys();render()}};
["p","t","c"].forEach(k=>{const a=$("#l"+k);a.onclick=()=>info(k);a.onkeydown=e=>{if(e.key==="Enter")info(k)}});
$("#mode").value=cfg.mode;$("#mode").onchange=e=>{cfg.mode=e.target.value;save();st(HINT[cfg.mode])};
$("#th").onclick=()=>{cfg.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";save();theme()};
$("#ex").onclick=()=>{if(!cur||!cur.msgs.length){st("Não há conversa para exportar.");return}
 const s="# "+cur.title+"\n\n"+cur.msgs.map(x=>(x.r==="u"?"## Você\n\n":"## "+BRAND.name+"\n\n")+x.t).join("\n\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/markdown;charset=utf-8"}));a.download="conversa.md";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
theme();cur=convs.find(c=>c.msgs.length)||null;render();list();
</script>
